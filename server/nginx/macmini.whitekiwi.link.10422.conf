server {
    listen 10422 ssl;
    server_name macmini.whitekiwi.link;

    ssl_certificate     /Users/whitekiwi/.lego/certificates/macmini.whitekiwi.link.crt;
    ssl_certificate_key /Users/whitekiwi/.lego/certificates/macmini.whitekiwi.link.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /opt/homebrew/var/log/nginx/beacon.access.log;
    error_log  /opt/homebrew/var/log/nginx/beacon.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:20422;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 10422;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
