name: Server CI

on:
  push:
    branches: [main]
    paths:
      - server/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - server/**
      - .github/workflows/ci.yml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
      - name: Unit tests
        run: pnpm test
      - name: Core HTTP component contracts
        run: pnpm test:e2e
      - name: Build server
        run: pnpm build
