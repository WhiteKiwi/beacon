name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - ios-v*

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Restore protected configuration
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$FIREBASE_PLIST_BASE64"
          test -n "$ASC_PRIVATE_KEY"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$FIREBASE_PLIST_BASE64" | base64 --decode > ios/beacon/GoogleService-Info.plist
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcodebuild archive
          -project ios/beacon.xcodeproj
          -scheme beacon
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Beacon.xcarchive"
          -allowProvisioningUpdates
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Beacon.xcarchive"
          -exportPath "$RUNNER_TEMP/BeaconExport"
          -exportOptionsPlist ios/ExportOptions.plist
          -allowProvisioningUpdates
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"

