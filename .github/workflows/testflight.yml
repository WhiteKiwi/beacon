name: TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - ios-v*

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Restore protected configuration
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$FIREBASE_PLIST_BASE64"
          test -n "$ASC_PRIVATE_KEY"
          test -n "$ASC_KEY_ID"
          test -n "$DISTRIBUTION_CERTIFICATE_BASE64"
          test -n "$DISTRIBUTION_CERTIFICATE_PASSWORD"
          test -n "$APP_PROFILE_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$FIREBASE_PLIST_BASE64" | base64 --decode > ios/beacon/GoogleService-Info.plist
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$RUNNER_TEMP/beacon-signing"
          printf '%s' "$DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/beacon-signing/distribution.p12"
          printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/beacon-signing/app.mobileprovision"
          chmod 600 "$RUNNER_TEMP/beacon-signing/"*
      - name: Install fixed signing assets
        env:
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/beacon-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/beacon-signing/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution: Jihoon Jang (4H4Z446LHS)'

          PROFILE_PLIST="$RUNNER_TEMP/beacon-signing/app.plist"
          security cms -D -i "$RUNNER_TEMP/beacon-signing/app.mobileprovision" -o "$PROFILE_PLIST"
          test "$(plutil -extract Name raw "$PROFILE_PLIST")" = 'Beacon App Store CI'
          test "$(plutil -extract Entitlements.application-identifier raw "$PROFILE_PLIST")" = '4H4Z446LHS.link.whitekiwi.beacon'
          test "$(plutil -extract Entitlements.get-task-allow raw "$PROFILE_PLIST")" = 'false'

          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          PROFILE_UUID="$(plutil -extract UUID raw "$PROFILE_PLIST")"
          mkdir -p "$PROFILE_DIR"
          install -m 600 "$RUNNER_TEMP/beacon-signing/app.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          xcodebuild archive
          -project ios/beacon.xcodeproj
          -scheme beacon
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Beacon.xcarchive"
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Beacon.xcarchive"
          -exportPath "$RUNNER_TEMP/BeaconExport"
          -exportOptionsPlist ios/ExportOptions.plist
          -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove temporary credentials
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          rm -f ios/beacon/GoogleService-Info.plist
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [[ -e "$RUNNER_TEMP/beacon-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/beacon-signing.keychain-db" || true
          fi
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          if [[ -f "$RUNNER_TEMP/beacon-signing/app.plist" ]]; then
            PROFILE_UUID="$(plutil -extract UUID raw "$RUNNER_TEMP/beacon-signing/app.plist")"
            rm -f "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          fi
          rm -f \
            "$RUNNER_TEMP/beacon-signing/distribution.p12" \
            "$RUNNER_TEMP/beacon-signing/app.mobileprovision" \
            "$RUNNER_TEMP/beacon-signing/app.plist"
          rmdir "$RUNNER_TEMP/beacon-signing" 2>/dev/null || true
